<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InfoDashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3e;
    --accent: #4f8ef7;
    --accent-dim: #1e3a6e;
    --text: #e2e5f1;
    --text-dim: #6b7280;
    --success: #22c55e;
    --warn: #f59e0b;
    --error: #ef4444;
    --code-bg: #12141e;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--accent-dim);
    color: var(--accent);
  }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 57px); }

  /* ── Chat panel ── */
  .chat-panel {
    display: flex;
    flex-direction: column;
    width: 480px;
    min-width: 360px;
    border-right: 1px solid var(--border);
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── Agent cards ── */
  .agent-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .2s;
  }
  .agent-card.active { border-color: var(--accent); }
  .agent-card.done { border-color: var(--border); opacity: .8; }
  .agent-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
  }
  .agent-icon { font-size: 18px; }
  .agent-name { font-size: 13px; font-weight: 600; flex: 1; }
  .agent-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
  }
  .status-running { background: var(--accent-dim); color: var(--accent); }
  .status-done    { background: #14291a; color: var(--success); }
  .status-failed  { background: #2a1414; color: var(--error); }
  .agent-body { padding: 10px 14px; font-size: 13px; line-height: 1.7; }
  .agent-body.empty { display: none; }
  .thinking-line {
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
  }
  .thinking-line::before { content: "⋯ "; }

  /* ── Code preview ── */
  .code-preview {
    background: var(--code-bg);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 180px;
    overflow-y: auto;
    margin-top: 6px;
    color: #a5b4fc;
  }

  /* ── Done card ── */
  .done-card {
    border: 1px solid var(--success);
    border-radius: var(--radius);
    padding: 16px;
    background: #0d1f14;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .done-card .label { font-size: 12px; color: var(--text-dim); }
  .done-card a {
    color: var(--success);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
  }
  .done-card a:hover { text-decoration: underline; }
  .open-btn {
    display: inline-block;
    margin-top: 4px;
    padding: 8px 16px;
    background: var(--success);
    color: #000;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
  }

  /* ── Error card ── */
  .error-card {
    border: 1px solid var(--error);
    border-radius: var(--radius);
    padding: 12px 14px;
    background: #1a0d0d;
    font-size: 13px;
    color: var(--error);
  }

  /* ── QA result ── */
  .qa-issues { margin-top: 6px; }
  .qa-issue {
    font-size: 12px;
    color: var(--warn);
    padding: 2px 0;
  }
  .qa-issue::before { content: "• "; }

  /* ── Input bar ── */
  .input-bar {
    padding: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    resize: none;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }
  .input-row { display: flex; gap: 8px; align-items: center; }
  .hint { font-size: 11px; color: var(--text-dim); flex: 1; }
  button {
    padding: 8px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Dashboards panel ── */
  .dashboards-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
    gap: 16px;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .06em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .refresh-btn {
    font-size: 11px;
    padding: 4px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .dashboard-item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .dashboard-info { flex: 1; min-width: 0; }
  .dashboard-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dashboard-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .dashboard-actions { display: flex; gap: 6px; }
  .btn-open {
    padding: 5px 12px;
    font-size: 12px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
  }
  .btn-stop {
    padding: 5px 10px;
    font-size: 12px;
    background: #2a1414;
    color: var(--error);
    border: 1px solid #3a1a1a;
    border-radius: 6px;
    cursor: pointer;
  }
  .no-dashboards { color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<header>
  <span style="font-size:22px">🏭</span>
  <h1>InfoDashboard</h1>
  <span class="badge">Beta</span>
</header>

<div class="layout">

  <!-- ── Chat / pipeline panel ── -->
  <div class="chat-panel">
    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <textarea id="input" rows="3"
        placeholder="用中文描述你想看的数据，例如：&#10;我要看冲压车间昨天的合格率，按产线对比，可以筛选日期"></textarea>
      <div class="input-row">
        <span class="hint">Ctrl+Enter 发送</span>
        <button id="sendBtn" onclick="sendRequest()">生成看板</button>
      </div>
    </div>
  </div>

  <!-- ── Running dashboards panel ── -->
  <div class="dashboards-panel">
    <div class="panel-title">
      已部署看板
      <button class="refresh-btn" onclick="loadDashboards()">刷新</button>
    </div>
    <div id="dashboardList"><span class="no-dashboards">暂无运行中的看板</span></div>
  </div>

</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('sendBtn');

// Ctrl+Enter to send
inputEl.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') sendRequest();
});

// ── State ──────────────────────────────────────────────────────────────────
let agentCards = {};   // agentId → {card, body, statusEl}

function sendRequest() {
  const text = inputEl.value.trim();
  if (!text) return;

  // Reset
  messagesEl.innerHTML = '';
  agentCards = {};
  sendBtn.disabled = true;

  // User bubble
  appendUserBubble(text);

  fetch('/api/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_request: text}),
  }).then(res => {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    function pump() {
      reader.read().then(({done, value}) => {
        if (done) { sendBtn.disabled = false; return; }
        buf += decoder.decode(value, {stream: true});
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const raw = line.slice(6).trim();
            if (raw === '[DONE]') { sendBtn.disabled = false; return; }
            try { handleEvent(JSON.parse(raw)); } catch {}
          }
        }
        pump();
      }).catch(err => {
        appendErrorCard('连接中断：' + err.message);
        sendBtn.disabled = false;
      });
    }
    pump();
  }).catch(err => {
    appendErrorCard('请求失败：' + err.message);
    sendBtn.disabled = false;
  });
}

// ── Event handlers ─────────────────────────────────────────────────────────
function handleEvent(ev) {
  switch (ev.type) {
    case 'agent_start':   onAgentStart(ev.data);   break;
    case 'text_delta':    onTextDelta(ev.data);     break;
    case 'thinking':      onThinking(ev.data);      break;
    case 'code_block':    onCodeBlock(ev.data);     break;
    case 'action':        onAction(ev.data);        break;
    case 'agent_end':     onAgentEnd(ev.data);      break;
    case 'done':          onDone(ev.data);          break;
    case 'error':         appendErrorCard(ev.data.message); break;
  }
}

function onAgentStart({agentId, agentName, agentIcon, retry}) {
  const card = document.createElement('div');
  card.className = 'agent-card active';
  card.innerHTML = `
    <div class="agent-header">
      <span class="agent-icon">${agentIcon || '🤖'}</span>
      <span class="agent-name">${agentName}${retry ? ` （重试 #${retry}）` : ''}</span>
      <span class="agent-status status-running" id="status-${agentId}">运行中</span>
    </div>
    <div class="agent-body empty" id="body-${agentId}"></div>
  `;
  messagesEl.appendChild(card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  agentCards[agentId] = {
    card,
    body: card.querySelector(`#body-${agentId}`),
    statusEl: card.querySelector(`#status-${agentId}`),
    textNode: null,
  };
}

function onTextDelta({content, agentId}) {
  const info = agentCards[agentId];
  if (!info) return;
  const body = info.body;
  body.classList.remove('empty');

  if (!info.textNode) {
    const p = document.createElement('p');
    body.appendChild(p);
    info.textNode = p;
  }
  info.textNode.textContent += content;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function onThinking({message}) {
  // Show the latest thinking message in the last active agent's body
  const ids = Object.keys(agentCards);
  if (!ids.length) return;
  const info = agentCards[ids[ids.length - 1]];
  const body = info.body;
  body.classList.remove('empty');

  // Update or create a thinking-line element
  let el = body.querySelector('.thinking-line');
  if (!el) {
    el = document.createElement('div');
    el.className = 'thinking-line';
    body.appendChild(el);
  }
  el.textContent = message;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function onCodeBlock({filename, language, content}) {
  const ids = Object.keys(agentCards);
  if (!ids.length) return;
  const info = agentCards[ids[ids.length - 1]];
  const body = info.body;
  body.classList.remove('empty');
  info.textNode = null;  // start fresh text after code block

  const wrapper = document.createElement('div');
  wrapper.innerHTML = `
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:2px">${filename}</div>
    <div class="code-preview">${escHtml(content)}</div>
  `;
  body.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function onAction({actionName, params}) {
  if (actionName === 'qa_complete') {
    const ids = Object.keys(agentCards);
    if (!ids.length) return;
    const info = agentCards[ids[ids.length - 1]];
    const body = info.body;
    body.classList.remove('empty');

    if (!params.passed && params.issues?.length) {
      const div = document.createElement('div');
      div.className = 'qa-issues';
      div.innerHTML = params.issues
        .map(i => `<div class="qa-issue">${escHtml(i)}</div>`).join('');
      body.appendChild(div);
    }
  }
}

function onAgentEnd({agentId}) {
  const info = agentCards[agentId];
  if (!info) return;
  info.card.classList.remove('active');
  info.card.classList.add('done');
  info.statusEl.className = 'agent-status status-done';
  info.statusEl.textContent = '完成';

  // Remove stale thinking line
  const tl = info.body.querySelector('.thinking-line');
  if (tl) tl.remove();
}

function onDone({dashboardUrl, port, dashboardId}) {
  const card = document.createElement('div');
  card.className = 'done-card';
  card.innerHTML = `
    <div class="label">✅ 看板已部署成功</div>
    <a href="${dashboardUrl}" target="_blank">${dashboardUrl}</a>
    <div class="label">Dashboard ID: ${dashboardId} &nbsp;|&nbsp; Port: ${port}</div>
    <a class="open-btn" href="${dashboardUrl}" target="_blank">打开看板 →</a>
  `;
  messagesEl.appendChild(card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  setTimeout(loadDashboards, 1500);
}

function appendErrorCard(msg) {
  const div = document.createElement('div');
  div.className = 'error-card';
  div.textContent = '⚠ ' + msg;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendUserBubble(text) {
  const div = document.createElement('div');
  div.style.cssText = 'background:var(--accent-dim);border-radius:8px;padding:10px 14px;font-size:13px;';
  div.textContent = text;
  messagesEl.appendChild(div);
}

// ── Dashboard list ─────────────────────────────────────────────────────────
async function loadDashboards() {
  const listEl = document.getElementById('dashboardList');
  try {
    const res = await fetch('/api/dashboards');
    const {dashboards} = await res.json();
    if (!dashboards.length) {
      listEl.innerHTML = '<span class="no-dashboards">暂无运行中的看板</span>';
      return;
    }
    listEl.innerHTML = dashboards.map(d => {
      const ports = Object.values(d.ports || {}).join(', ');
      const url = ports ? `http://localhost:${ports}` : '#';
      return `
        <div class="dashboard-item">
          <div class="dashboard-info">
            <div class="dashboard-name">${d.name}</div>
            <div class="dashboard-meta">${d.image} &nbsp;|&nbsp; ${d.status} &nbsp;|&nbsp; Port: ${ports}</div>
          </div>
          <div class="dashboard-actions">
            <a class="btn-open" href="${url}" target="_blank">打开</a>
            <button class="btn-stop" onclick="stopDashboard('${d.id}', this)">停止</button>
          </div>
        </div>
      `;
    }).join('');
  } catch {
    listEl.innerHTML = '<span class="no-dashboards">获取看板列表失败</span>';
  }
}

async function stopDashboard(id, btn) {
  btn.disabled = true;
  await fetch(`/api/dashboards/${id}`, {method: 'DELETE'});
  loadDashboards();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Load on start
loadDashboards();
</script>
</body>
</html>
