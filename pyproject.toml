[project]
name = "infodashboard"
version = "0.1.0"
description = "NLP → Streamlit dashboard generator with Docker deployment for databases"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "python-tds>=1.15.0",   # pytds — pure Python TDS, works through SOCKS5
    "pysocks>=1.7.1",
    "docker>=7.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.10.0",
    "bandit>=1.7.0",        # static security analysis for generated code
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestration", "tools"]
